<svg viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="780" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="55" font-size="30" font-weight="700" fill="#0f172a">Autonomous Ackermann Robot</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Custom Perception &#8594; Control loop &#8212; Simulation-in-the-loop</text>

  <!-- ROS2 graph group boundary -->
  <rect x="20" y="120" width="1220" height="270" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="145" font-size="14" font-weight="700" fill="#1d4ed8" letter-spacing="1">ROS2 GRAPH &#8212; UBUNTU VM (KILTED)</text>

  <!-- Node 1: Bridge Node -->
  <rect x="40" y="175" width="150" height="80" rx="10" fill="#1d4ed8"/>
  <text x="115" y="210" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Bridge Node</text>
  <text x="115" y="230" font-size="12" fill="#dbeafe" text-anchor="middle">ZeroMQ &#8596; ROS2</text>

  <!-- arrow bridge -> camera topic -->
  <line x1="190" y1="215" x2="222" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Topic pill: /camera/image -->
  <rect x="224" y="185" width="140" height="60" rx="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="294" y="212" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">/camera/image</text>
  <text x="294" y="230" font-size="11" fill="#64748b" text-anchor="middle">sensor_msgs/Image</text>

  <!-- arrow camera topic -> perception -->
  <line x1="364" y1="215" x2="396" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: Perception Node -->
  <rect x="398" y="175" width="170" height="80" rx="10" fill="#1d4ed8"/>
  <text x="483" y="205" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Perception Node</text>
  <text x="483" y="224" font-size="12" fill="#dbeafe" text-anchor="middle">custom CNN &#8212; PyTorch</text>
  <text x="483" y="240" font-size="11" fill="#bfdbfe" text-anchor="middle">trained on sim dataset</text>

  <!-- arrow perception -> lane_state -->
  <line x1="568" y1="215" x2="600" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Topic pill: /lane_state -->
  <rect x="602" y="180" width="190" height="70" rx="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="697" y="203" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">/lane_state</text>
  <text x="697" y="220" font-size="10.5" fill="#64748b" text-anchor="middle">lateral_error, heading_error</text>
  <text x="697" y="234" font-size="10.5" fill="#94a3b8" text-anchor="middle">curvature &#954; &#8212; in progress</text>

  <!-- arrow lane_state -> mpc -->
  <line x1="792" y1="215" x2="824" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3: MPC Node -->
  <rect x="826" y="175" width="170" height="80" rx="10" fill="#1d4ed8"/>
  <text x="911" y="205" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">MPC Node</text>
  <text x="911" y="224" font-size="12" fill="#dbeafe" text-anchor="middle">acados &#8212; RTI scheme</text>
  <text x="911" y="240" font-size="11" fill="#bfdbfe" text-anchor="middle">bicycle model, L = 0.26 m</text>

  <!-- arrow mpc -> cmd topic -->
  <line x1="996" y1="215" x2="1028" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Topic pill: /cmd_ackermann -->
  <rect x="1030" y="185" width="180" height="60" rx="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1120" y="212" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">/cmd_ackermann</text>
  <text x="1120" y="230" font-size="11" fill="#64748b" text-anchor="middle">steering, velocity</text>

  <!-- return loop: cmd topic -> bridge node (curved path along bottom of ROS2 box) -->
  <path d="M 1120 245 C 1120 330, 115 330, 115 257" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="617" y="345" font-size="12" fill="#94a3b8" text-anchor="middle">control loop closes back through the bridge each tick</text>

  <!-- Simulation group -->
  <rect x="40" y="470" width="560" height="180" rx="14" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="60" y="495" font-size="14" font-weight="700" fill="#b45309" letter-spacing="1">SIMULATION &#8212; OUTSIDE THE ROS2 GRAPH</text>

  <rect x="60" y="520" width="280" height="100" rx="10" fill="#b45309"/>
  <text x="200" y="555" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">MuJoCo 3.11</text>
  <text x="200" y="575" font-size="12" fill="#fef3c7" text-anchor="middle">physics + car model</text>
  <text x="200" y="592" font-size="11" fill="#fde68a" text-anchor="middle">macOS, Apple Silicon</text>

  <text x="380" y="555" font-size="12" fill="#78350f" width="200">renders camera frames,</text>
  <text x="380" y="573" font-size="12" fill="#78350f">applies steering + velocity,</text>
  <text x="380" y="591" font-size="12" fill="#78350f">steps physics each tick</text>

  <!-- bidirectional link bridge <-> simulator -->
  <line x1="115" y1="470" x2="115" y2="400" stroke="#b45309" stroke-width="2.5" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
  <text x="130" y="425" font-size="12" font-weight="600" fill="#78350f">ZeroMQ</text>
  <text x="130" y="441" font-size="11" fill="#92400e">JSON + raw image bytes</text>
  <text x="130" y="457" font-size="11" fill="#92400e">no pickle, cross-Python-safe</text>

  <!-- footer caption -->
  <text x="40" y="700" font-size="13" fill="#64748b">Ubuntu VM &#183; ROS2 Kilted &#160;&#8596;&#160; macOS &#183; MuJoCo &#8212; sim-to-real: camera frame &#8594; CNN perception &#8594; MPC control &#8594; simulated actuation</text>
  <text x="40" y="722" font-size="12" fill="#94a3b8">github.com/RemiNollet/autonomous-robot-ackerman</text>
</svg>
